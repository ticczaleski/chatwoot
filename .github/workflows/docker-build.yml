name: Build & Push Docker Image

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.github/workflows/sync-upstream.yml'
    tags:
      - 'v*'
      - '*.*.*'
      - '*.*.*-*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Tag customizada para a imagem Docker (ex: 4.18.0-wa.2)'
        required: false
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ticczaleski/chatwoot

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract app version
        id: app_version
        run: |
          BASE_VERSION=$(jq -r '.version // "4.18.0"' package.json)
          CHANGELOG_VERSION=$(grep -m 1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+(-wa(\.[0-9]+)?)?\]' CHANGELOG.md | tr -d '[]' || true)
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "changelog_version=${CHANGELOG_VERSION:-$BASE_VERSION-wa}" >> "$GITHUB_OUTPUT"
          echo "Base version: ${BASE_VERSION}"
          echo "Changelog version: ${CHANGELOG_VERSION}"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.app_version.outputs.base_version }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.app_version.outputs.base_version }}-wa,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.app_version.outputs.changelog_version }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RAILS_ENV=production
            NODE_ENV=production
