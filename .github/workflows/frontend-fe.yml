name: Frontend Lint & Test

on:
  push:
    branches:
      - develop
    paths:
      - 'app/javascript/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.eslintrc.js'
      - '.prettierrc'
      - 'tailwind.config.js'
      - 'vite*.ts'
      - 'vitest*.ts'
      - 'vitest*.js'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint
        run: pnpm run eslint

      - name: Run frontend tests for changed files only
        run: |
          mkdir -p coverage
          # Identify changed JavaScript, Vue and TypeScript files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^app/javascript/.*\.(js|vue|ts)$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Running vitest related on modified files:"
            echo "$CHANGED_FILES"
            pnpm exec vitest related $CHANGED_FILES --run --passWithNoTests
          else
            echo "No frontend code files changed in this commit. Skipping vitest."
          fi
